<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de almacén</title>
<style>
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#1d2a26; --muted:#5d6b66; --line:#cfd8d3;
  --main:#1f5c4d; --main-ink:#ffffff; --warn:#b4531f; --warn-bg:#fbeadf; --danger:#a12a2a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141b19; --panel:#1d2724; --ink:#e6eeea; --muted:#9babA5; --line:#33433e; --main:#5fbfa4; --main-ink:#0e1a16; --warn:#f0a070; --warn-bg:#3a2a20; --danger:#ff8a8a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,th,button,label,input,select,.stat b{font-family:"Trebuchet MS",Verdana,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--main);padding:10px 14px}
.stat b{display:block;font-size:1.6rem}
.stat.low{border-left-color:var(--warn)}
form,.tablebox{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:20px}
h2{font-size:1.1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--muted)}
input,select{width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
button{padding:9px 16px;border:1px solid var(--main);background:var(--main);color:var(--main-ink);font-size:.95rem;cursor:pointer}
button.ghost{background:transparent;color:var(--main)}
button.del{background:transparent;color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:180px;margin:0}
.tools select{width:auto;margin:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted)}
tr.low td{background:var(--warn-bg)}
td.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:20px 8px}
td .row{display:flex;gap:6px}
td button{padding:5px 10px;font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Control de almacén</h1>
  <p class="sub">Agrega, edita o elimina productos por categoría. Los datos se guardan en este navegador.</p>

  <section class="stats" aria-label="Resumen">
    <div class="stat"><b id="sProd">0</b>productos</div>
    <div class="stat"><b id="sUnits">0</b>unidades en total</div>
    <div class="stat low"><b id="sLow">0</b>con stock bajo</div>
  </section>

  <form id="form">
    <h2 id="formTitle">Agregar producto</h2>
    <div class="grid">
      <label>Categoría<input id="cat" required maxlength="40"></label>
      <label>Cantidad<input id="qty" type="number" min="0" step="1" required></label>
      <label>Stock mínimo (0 o 1)<input id="min" type="number" min="0" max="1" step="1" value="1"></label>
    </div>
    <div class="actions">
      <button type="submit" id="saveBtn">Agregar producto</button>
      <button type="button" class="ghost" id="cancelBtn" hidden>Cancelar edición</button>
    </div>
  </form>

  <section class="tablebox">
    <h2>Inventario</h2>
    <div class="tools">
      <input id="search" type="search" placeholder="Buscar por categoría" aria-label="Buscar">
      <select id="filter" aria-label="Filtrar">
        <option value="all">Todos</option>
        <option value="low">Solo stock bajo</option>
      </select>
      <button class="ghost" id="exportBtn" type="button">Exportar CSV</button>
      <button class="ghost" id="backupBtn" type="button">Respaldo JSON</button>
      <button class="ghost" id="importBtn" type="button">Importar JSON</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Categoría</th><th>Cantidad</th><th>Mínimo</th><th>Acciones</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>No hay productos. Agrega el primero con el formulario de arriba.</div>
  </section>
</main>

<script>
const KEY = "almacen_stock_v1";
let items = [];
let editingId = null;
const $ = id => document.getElementById(id);

function load(){
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ items = []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch(e){ alert("No se pudo guardar en el navegador. Usa «Respaldo JSON» para conservar tus datos."); }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isLow = i => i.qty <= i.min;

function render(){
  const q = $("search").value.trim().toLowerCase();
  const f = $("filter").value;
  const list = items.filter(i =>
    (!q || i.cat.toLowerCase().includes(q)) && (f==="all" || isLow(i))
  );
  $("body").innerHTML = list.map(i => `
    <tr class="${isLow(i)?"low":""}">
      <td>${esc(i.cat)}</td>
      <td class="num">${i.qty}${isLow(i)?" ⚠":""}</td><td class="num">${i.min}</td>
      <td><div class="row">
        <button type="button" data-act="edit" data-id="${i.id}">Editar</button>
        <button type="button" class="del" data-act="del" data-id="${i.id}">Eliminar</button>
      </div></td>
    </tr>`).join("");
  $("empty").hidden = list.length > 0;
  $("sProd").textContent = items.length;
  $("sUnits").textContent = items.reduce((a,i)=>a+i.qty,0);
  $("sLow").textContent = items.filter(isLow).length;
}

function resetForm(){
  editingId = null;
  $("form").reset();
  $("min").value = 1;
  $("formTitle").textContent = "Agregar producto";
  $("saveBtn").textContent = "Agregar producto";
  $("cancelBtn").hidden = true;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const data = {
    cat: $("cat").value.trim(),
    qty: parseInt($("qty").value,10)||0, min: Math.min(1, Math.max(0, parseInt($("min").value,10)||0))
  };
  if(editingId){
    items = items.map(i => i.id===editingId ? {...i,...data} : i);
  } else {
    items.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), ...data});
  }
  save(); resetForm(); render();
});

$("body").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const item = items.find(i => i.id===b.dataset.id); if(!item) return;
  if(b.dataset.act==="edit"){
    editingId = item.id;
    $("cat").value=item.cat;
    $("qty").value=item.qty; $("min").value=item.min;
    $("formTitle").textContent = "Editar producto";
    $("saveBtn").textContent = "Guardar cambios";
    $("cancelBtn").hidden = false;
    $("form").scrollIntoView({behavior:"smooth"}); $("cat").focus();
  } else if(b.dataset.act==="del"){
    if(confirm("¿Eliminar «"+item.cat+"»? Esta acción no se puede deshacer.")){
      items = items.filter(i => i.id!==item.id);
      if(editingId===item.id) resetForm();
      save(); render();
    }
  }
});

$("cancelBtn").addEventListener("click", resetForm);
$("search").addEventListener("input", render);
$("filter").addEventListener("change", render);

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("exportBtn").addEventListener("click", () => {
  const rows = [["Categoría","Cantidad","Mínimo"]]
    .concat(items.map(i => [i.cat,i.qty,i.min]));
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  download("inventario.csv", "\ufeff"+csv, "text/csv;charset=utf-8");
});
$("backupBtn").addEventListener("click", () => download("respaldo-almacen.json", JSON.stringify(items,null,2), "application/json"));
$("importBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw new Error();
      if(!confirm("Esto reemplazará el inventario actual con "+data.length+" productos. ¿Continuar?")) return;
      items = data.map(i => ({
        id: i.id || Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        cat: String(i.cat||""),
        qty: parseInt(i.qty,10)||0, min: Math.min(1, Math.max(0, parseInt(i.min,10)||0))
      }));
      save(); render();
    } catch(err){ alert("El archivo no es un respaldo válido."); }
  };
  r.readAsText(file); e.target.value = "";
});

load(); render();
</script>
</body>
</html>
