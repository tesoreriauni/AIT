<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f8;--card:#fff;--ink:#14162b;--mut:#6b7090;--line:#e3e5ee;--acc:#5b4bff;--accink:#fff;
  --ok:#12804a;--okbg:#e0f5ea;--warn:#a85f00;--warnbg:#fff0d0;--bad:#c4203f;--badbg:#fde3e8;--shadow:0 8px 30px rgba(30,30,80,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1120;--card:#171a2e;--ink:#eceefb;--mut:#9a9fc2;--line:#272b48;--acc:#8b7dff;--accink:#0f1120;
  --ok:#4be3a2;--okbg:#15342a;--warn:#ffb84d;--warnbg:#3a2d12;--bad:#ff7a93;--badbg:#3d1a25;--shadow:0 8px 30px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--acc);color:var(--accink);transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:9px}
.btn.danger{background:var(--badbg);color:var(--bad)}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);transition:border-color .15s}
input:focus,select:focus{border-color:var(--acc);outline:none}
label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:6px}

/* Login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brandside{background:linear-gradient(150deg,#2b20c9,#6d3fff 70%,#9b6bff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brandside h1{font-size:clamp(2rem,4vw,3.4rem);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.03em;max-width:12ch}
.brandside p{opacity:.85;max-width:34ch;margin:14px 0 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.logo i{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center}
.logo i::after{content:"";width:12px;height:12px;border-radius:3px;background:#5b4bff}
.crates{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:340px}
.crate{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.92)}
.crate.low{background:rgba(255,255,255,.45)}
.crate.out{background:transparent;border:2px dashed rgba(255,255,255,.5)}
.formside{display:grid;place-items:center;padding:32px}
#loginForm{width:100%;max-width:360px}
#loginForm h2{font-size:1.9rem;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
#loginForm .sub{color:var(--mut);margin:0 0 26px}
.field{margin-bottom:16px;position:relative}
.eye{position:absolute;right:8px;bottom:6px;background:none;border:0;color:var(--mut);font-size:.8rem;font-weight:700;padding:6px}
#loginMsg{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:0 0 10px}
#lBtn{width:100%;padding:13px}
@media(max-width:800px){#login{grid-template-columns:1fr}.brandside{padding:28px;gap:24px}.crates{display:none}}

/* App */
#app{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.top .logo i{background:var(--acc)}.top .logo i::after{background:var(--accink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{text-align:left;background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:border-color .15s}
.kpi:hover,.kpi.on{border-color:var(--acc)}
.kpi span{display:block;color:var(--mut);font-weight:700;font-size:.85rem}
.kpi b{display:block;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.kpi.low b{color:var(--warn)}.kpi.out b{color:var(--bad)}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input{flex:1;min-width:180px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;color:var(--mut);font-size:.85rem}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.78rem;color:var(--mut);font-weight:700;padding:8px 10px}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.cat{font-weight:700}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:800}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.low{background:var(--warnbg);color:var(--warn)}.chip.out{background:var(--badbg);color:var(--bad)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-weight:800}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
@media(max-width:620px){.hm{display:none}}

dialog{border:0;border-radius:22px;padding:24px;width:min(420px,92vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,30,.55);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 18px;font-size:1.3rem;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);z-index:20}
#toast.err{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="login" hidden>
  <section class="brandside">
    <div class="logo"><i></i>Almacén</div>
    <div>
      <h1>Tu stock, siempre a la vista.</h1>
      <p>Controla qué hay, qué se está acabando y qué ya no queda.</p>
    </div>
    <div class="crates" id="crates" aria-hidden="true"></div>
  </section>
  <section class="formside">
    <form id="loginForm">
      <h2>Bienvenida</h2>
      <p class="sub">Inicia sesión para entrar al inventario.</p>
      <div class="field"><label for="lUser">Usuario</label><input id="lUser" autocomplete="username" required></div>
      <div class="field"><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye">Mostrar</button></div>
      <p id="loginMsg" role="alert"></p>
      <button class="btn" id="lBtn" type="submit">Entrar</button>
    </form>
  </section>
</main>

<main id="app" hidden>
  <header class="top">
    <div class="logo"><i></i>Almacén</div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="addBtn" type="button">+ Agregar producto</button>
      <button class="btn ghost" id="logout" type="button">Salir</button>
    </div>
  </header>

  <section class="kpis" aria-label="Resumen">
    <button class="kpi on" data-f="all" type="button"><span>Productos</span><b id="sProd">0</b></button>
    <button class="kpi" data-f="all" type="button"><span>Unidades en stock</span><b id="sUnits">0</b></button>
    <button class="kpi low" data-f="low" type="button"><span>Stock bajo</span><b id="sLow">0</b></button>
    <button class="kpi out" data-f="out" type="button"><span>Agotados</span><b id="sOut">0</b></button>
  </section>

  <section class="panel">
    <div class="bar">
      <input id="search" type="search" placeholder="Buscar categoría…" aria-label="Buscar">
      <div class="seg" id="seg">
        <button type="button" data-f="all" class="on">Todos</button>
        <button type="button" data-f="ok">Disponibles</button>
        <button type="button" data-f="low">Stock bajo</button>
        <button type="button" data-f="out">Agotados</button>
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Categoría</th><th>Estado</th><th>Cantidad</th><th class="hm">Mínimo</th><th></th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden></div>
    <div class="bar" style="margin:14px 0 0">
      <button class="btn ghost sm" id="exportBtn" type="button">Exportar CSV</button>
      <button class="btn ghost sm" id="backupBtn" type="button">Respaldo JSON</button>
      <button class="btn ghost sm" id="importBtn" type="button">Importar JSON</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form id="form">
    <h2 id="formTitle">Agregar producto</h2>
    <div class="field"><label for="cat">Categoría</label><input id="cat" required maxlength="40"></div>
    <div class="two">
      <div><label for="qty">Cantidad</label><input id="qty" type="number" min="0" step="1" required></div>
      <div><label for="min">Stock mínimo (0 o 1)</label><input id="min" type="number" min="0" max="1" step="1" value="1"></div>
    </div>
    <div class="dact">
      <button class="btn ghost" id="cancelBtn" type="button">Cancelar</button>
      <button class="btn" id="saveBtn" type="submit">Guardar</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden role="status"></div>

<script>
const LOGIN_URL = "https://aehmbawfspczynsqvqqx.supabase.co/functions/v1/login";
const API_URL = "https://aehmbawfspczynsqvqqx.supabase.co/functions/v1/discointerno";
const TOKKEY = "almacen_token_v1";
const $ = id => document.getElementById(id);
let items = [], editingId = null, started = false, flt = "all", tt;

const getToken = () => { try { return localStorage.getItem(TOKKEY); } catch(e){ return null; } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = i => i.qty === 0 ? "out" : (i.qty <= i.min ? "low" : "ok");
const LABEL = {ok:"Disponible", low:"Stock bajo", out:"Agotado"};

function toast(t, err){
  const el = $("toast"); el.textContent = t; el.className = err ? "err" : ""; el.hidden = !t;
  clearTimeout(tt); if(t) tt = setTimeout(() => el.hidden = true, err ? 5000 : 2200);
}

// ---------- Comunicación con la Edge Function del bucket ----------
async function api(body){
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json","x-app-token":getToken()||""}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){
    try { localStorage.removeItem(TOKKEY); } catch(e){}
    showLogin("Tu sesión venció. Inicia sesión de nuevo.");
    throw new Error("Sesión vencida");
  }
  if(!r.ok) throw new Error(j.error || "Error " + r.status);
  items = j.items; render(); return j;
}
async function run(body, okMsg){
  try { await api(body); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast("No se pudo completar: " + e.message, true); return false; }
}

// ---------- Interfaz ----------
function render(){
  const q = $("search").value.trim().toLowerCase();
  const list = items.filter(i => (!q || i.cat.toLowerCase().includes(q)) && (flt === "all" || st(i) === flt));
  $("body").innerHTML = list.map(i => { const s = st(i); return `
    <tr>
      <td class="cat">${esc(i.cat)}</td>
      <td><span class="chip ${s}">${LABEL[s]}</span></td>
      <td><span class="step">
        <button type="button" data-act="dec" data-id="${esc(i.id)}" aria-label="Restar uno" ${i.qty===0?"disabled":""}>−</button>
        <output>${i.qty}</output>
        <button type="button" data-act="inc" data-id="${esc(i.id)}" aria-label="Sumar uno">+</button></span></td>
      <td class="hm">${i.min}</td>
      <td><div class="acts">
        <button type="button" class="btn ghost sm" data-act="edit" data-id="${esc(i.id)}">Editar</button>
        <button type="button" class="btn danger sm" data-act="del" data-id="${esc(i.id)}">Eliminar</button>
      </div></td>
    </tr>`; }).join("");
  const e = $("empty");
  e.hidden = list.length > 0;
  e.textContent = items.length ? "No hay productos que coincidan con este filtro." : "Aún no hay productos. Pulsa «Agregar producto» para empezar.";
  $("sProd").textContent = items.length;
  $("sUnits").textContent = items.reduce((a,i) => a + i.qty, 0);
  $("sLow").textContent = items.filter(i => st(i) === "low").length;
  $("sOut").textContent = items.filter(i => st(i) === "out").length;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.f === flt));
  document.querySelectorAll(".kpi").forEach((k, n) => k.classList.toggle("on", n !== 1 && k.dataset.f === flt));
}
function setFilter(f){ flt = f; render(); }
document.querySelectorAll("#seg button, .kpi").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.f)));
$("search").addEventListener("input", render);

function openForm(item){
  editingId = item ? item.id : null;
  $("form").reset();
  $("cat").value = item ? item.cat : ""; $("qty").value = item ? item.qty : ""; $("min").value = item ? item.min : 1;
  $("formTitle").textContent = item ? "Editar producto" : "Agregar producto";
  $("dlg").showModal(); $("cat").focus();
}
$("addBtn").addEventListener("click", () => openForm());
$("cancelBtn").addEventListener("click", () => $("dlg").close());
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const data = {cat:$("cat").value.trim(), qty:parseInt($("qty").value,10)||0, min:Math.min(1,Math.max(0,parseInt($("min").value,10)||0))};
  $("saveBtn").disabled = true;
  const ok = await run(editingId ? {action:"update", id:editingId, ...data} : {action:"add", ...data}, editingId ? "Cambios guardados" : "Producto agregado");
  $("saveBtn").disabled = false;
  if(ok) $("dlg").close();
});

$("body").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const item = items.find(i => i.id === b.dataset.id); if(!item) return;
  const a = b.dataset.act;
  if(a === "edit") openForm(item);
  else if(a === "inc" || a === "dec") run({action:"update", id:item.id, cat:item.cat, min:item.min, qty:Math.max(0, item.qty + (a==="inc"?1:-1))});
  else if(a === "del" && confirm("¿Eliminar «" + item.cat + "»? Esta acción no se puede deshacer.")) run({action:"delete", id:item.id}, "Producto eliminado");
});

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("exportBtn").addEventListener("click", () => {
  const rows = [["Categoría","Cantidad","Mínimo","Estado"]].concat(items.map(i => [i.cat, i.qty, i.min, LABEL[st(i)]]));
  download("inventario.csv", "\ufeff" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\n"), "text/csv;charset=utf-8");
});
$("backupBtn").addEventListener("click", () => download("respaldo-almacen.json", JSON.stringify(items, null, 2), "application/json"));
$("importBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); if(!Array.isArray(data)) throw new Error(); }
    catch(err){ toast("El archivo no es un respaldo válido.", true); return; }
    if(confirm("Esto reemplazará el inventario actual con " + data.length + " productos. ¿Continuar?")) run({action:"replace", items:data}, "Inventario importado");
  };
  r.readAsText(file); e.target.value = "";
});
$("logout").addEventListener("click", () => { try { localStorage.removeItem(TOKKEY); } catch(e){} location.reload(); });

// ---------- Inicio de sesión ----------
$("crates").innerHTML = "ssslsssosllsossssolsslss".slice(0,20).split("").map(c => `<div class="crate ${c==="l"?"low":c==="o"?"out":""}"></div>`).join("");
$("eye").addEventListener("click", () => {
  const p = $("lPass"), show = p.type === "password";
  p.type = show ? "text" : "password"; $("eye").textContent = show ? "Ocultar" : "Mostrar";
});
async function callLogin(body){
  const r = await fetch(LOGIN_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return {ok:r.ok, ...(await r.json().catch(() => ({})))};
}
function showApp(){
  $("login").hidden = true; $("app").hidden = false;
  if(started) return; started = true;
  run({action:"list"});
}
function showLogin(msg){
  $("app").hidden = true; $("login").hidden = false;
  $("loginMsg").textContent = msg || ""; started = false; $("lUser").focus();
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = ""; $("lBtn").disabled = true;
  try {
    const r = await callLogin({user:$("lUser").value.trim(), pass:$("lPass").value});
    if(r.ok && r.token){ try { localStorage.setItem(TOKKEY, r.token); } catch(err){} $("lPass").value = ""; showApp(); }
    else $("loginMsg").textContent = r.error || "Usuario o contraseña incorrectos.";
  } catch(err){ $("loginMsg").textContent = "No se pudo conectar con el servicio de acceso."; }
  $("lBtn").disabled = false;
});

const t0 = getToken();
if(t0) callLogin({action:"verify", token:t0}).then(r => r.ok ? showApp() : showLogin()).catch(() => showLogin("No se pudo verificar la sesión."));
else showLogin();
</script>
</body>
</html>
